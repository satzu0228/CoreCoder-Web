[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corecoder"
version = "0.4.0"
description = "Local-first Web coding agent with streamed tool traces and human approval for side effects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "satzu0228" },
]
keywords = ["ai", "agent", "coding", "web", "llm", "human-in-the-loop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["corecoder"]

[tool.hatch.build.targets.wheel.force-include]
"corecoder/web/static/dist" = "corecoder/web/static/dist"

[tool.hatch.build.targets.sdist.force-include]
"corecoder/web/static/dist" = "corecoder/web/static/dist"

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = ["pytest>=7.0", "ruff>=0.9.0,<1.0"]

[project.scripts]
corecoder = "corecoder.cli:main"

[project.urls]
Homepage = "https://github.com/satzu0228/CoreCoder-Web"
Repository = "https://github.com/satzu0228/CoreCoder-Web"
Issues = "https://github.com/satzu0228/CoreCoder-Web/issues"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
