<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CoreCoder Web</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; }

  /* ── conversation log ── */
  #log { white-space: pre-wrap; border: 1px solid #ccc; border-radius: 6px; padding: 12px;
         min-height: 200px; margin-bottom: 12px; }
  #log .turn { margin-bottom: 16px; }
  #log .user  { color: #555; }
  #log .error { color: #c0392b; }

  /* ── tool timeline ── */
  .timeline { margin: 8px 0 0 0; padding: 0; list-style: none; }
  .tool-card {
    display: flex; flex-direction: column;
    border: 1px solid #e0e0e0; border-radius: 6px;
    padding: 8px 12px; margin-bottom: 6px;
    font-size: 13px; background: #fafafa;
  }
  .tool-card.running { border-color: #f0a500; background: #fffdf0; }
  .tool-card.done    { border-color: #4caf50; background: #f6fff6; }
  .tool-header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .tool-status { font-size: 11px; padding: 2px 6px; border-radius: 10px; }
  .tool-status.running { background: #f0a500; color: #fff; }
  .tool-status.done    { background: #4caf50; color: #fff; }
  .tool-args { color: #666; font-size: 12px; margin-top: 4px; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  .tool-result { color: #333; font-size: 12px; margin-top: 6px; white-space: pre-wrap;
                 max-height: 120px; overflow-y: auto; border-top: 1px solid #e0e0e0;
                 padding-top: 6px; display: none; }
  .tool-result.visible { display: block; }
  .toggle-result { font-size: 11px; color: #0077cc; cursor: pointer; margin-top: 4px;
                   background: none; border: none; padding: 0; }

  /* ── input form ── */
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px; font-size: 14px; }
  button { padding: 8px 16px; }

  /* ── confirm modal ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
                   z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.visible { display: flex; }
  .modal { background: #fff; border-radius: 8px; padding: 24px; max-width: 600px;
           max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
  .modal h2 { margin-top: 0; font-size: 18px; }
  .modal-diff { background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px;
                padding: 12px; margin: 12px 0; font-family: monospace; font-size: 12px;
                white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
  .modal-buttons { display: flex; gap: 12px; margin-top: 16px; justify-content: flex-end; }
  .modal-buttons button { padding: 8px 16px; border: 1px solid #ccc; border-radius: 4px;
                          cursor: pointer; background: #fff; }
  .modal-buttons .btn-approve { background: #4caf50; color: #fff; border-color: #4caf50; }
  .modal-buttons .btn-reject { background: #f44336; color: #fff; border-color: #f44336; }
</style>
</head>
<body>
  <h1>CoreCoder Web</h1>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask CoreCoder to do something..." autocomplete="off">
    <button type="submit">Send</button>
  </form>

  <div id="confirmModal" class="modal-overlay">
    <div class="modal">
      <h2 id="confirmTitle">Confirm Action</h2>
      <div id="confirmContent"></div>
      <div class="modal-buttons">
        <button class="btn-reject" id="btnReject">Reject</button>
        <button class="btn-approve" id="btnApprove">Approve</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const urlToken = params.get("token");
    const token = urlToken || sessionStorage.getItem("corecoder-token") || "";
    if (urlToken) {
      sessionStorage.setItem("corecoder-token", urlToken);
      params.delete("token");
      const query = params.toString();
      history.replaceState(null, "", `${location.pathname}${query ? `?${query}` : ""}${location.hash}`);
    }
    const log   = document.getElementById("log");
    const form  = document.getElementById("form");
    const input = document.getElementById("input");

    // ── DOM helpers ──────────────────────────────────────────────────────────

    function appendTurn(className) {
      const div = document.createElement("div");
      div.className = "turn " + className;
      log.appendChild(div);
      return div;
    }

    function makeTimeline(container) {
      const ul = document.createElement("ul");
      ul.className = "timeline";
      container.appendChild(ul);
      return ul;
    }

    function addToolCard(timeline, toolId, name, args) {
      const li = document.createElement("li");
      li.className = "tool-card running";
      li.dataset.toolId = toolId;

      const argsText = Object.entries(args)
        .map(([k, v]) => `${k}: ${JSON.stringify(v).slice(0, 80)}`)
        .join("  ");

      li.innerHTML = `
        <div class="tool-header">
          <span class="tool-status running">running</span>
          <span>${escHtml(name)}</span>
        </div>
        <div class="tool-args">${escHtml(argsText)}</div>
      `;
      timeline.appendChild(li);
      return li;
    }

    function finishToolCard(card, result) {
      card.classList.replace("running", "done");
      const badge = card.querySelector(".tool-status");
      badge.classList.replace("running", "done");
      badge.textContent = "done";

      const resultEl = document.createElement("div");
      resultEl.className = "tool-result";
      resultEl.textContent = result;
      card.appendChild(resultEl);

      if (result && result !== "(no output)") {
        const toggle = document.createElement("button");
        toggle.className = "toggle-result";
        toggle.textContent = "▶ show result";
        toggle.addEventListener("click", () => {
          const visible = resultEl.classList.toggle("visible");
          toggle.textContent = visible ? "▼ hide result" : "▶ show result";
        });
        card.appendChild(toggle);
      }
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // ── Confirm Modal ────────────────────────────────────────────────────────

    let pendingConfirmId = null;

    function showConfirmModal(evt) {
      pendingConfirmId = evt.id;
      const modal = document.getElementById("confirmModal");
      const title = document.getElementById("confirmTitle");
      const content = document.getElementById("confirmContent");

      title.textContent = evt.action === "edit_file"
        ? "Confirm Edit"
        : evt.action === "write_file"
          ? "Confirm Write"
          : "Confirm Command";

      content.innerHTML = "";
      if (evt.action === "edit_file" || evt.action === "write_file") {
        const fileEl = document.createElement("div");
        fileEl.innerHTML = `<strong>File:</strong> <code>${escHtml(evt.file_path)}</code>`;
        content.appendChild(fileEl);
      }
      if (evt.action === "bash") {
        const cmdEl = document.createElement("div");
        cmdEl.innerHTML = `<strong>Command:</strong> <code>${escHtml(evt.command)}</code>`;
        content.appendChild(cmdEl);
      }
      if (evt.diff) {
        const diffLabel = document.createElement("div");
        diffLabel.style.marginTop = "12px";
        diffLabel.innerHTML = "<strong>Changes:</strong>";
        content.appendChild(diffLabel);

        const diffEl = document.createElement("div");
        diffEl.className = "modal-diff";
        diffEl.textContent = evt.diff;
        content.appendChild(diffEl);
      }

      modal.classList.add("visible");
    }

    function hideConfirmModal() {
      const modal = document.getElementById("confirmModal");
      modal.classList.remove("visible");
      pendingConfirmId = null;
    }

    async function submitConfirm(approve) {
      if (!pendingConfirmId) return;

      const resp = await fetch("/api/confirm", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CoreCoder-Token": token,
        },
        body: JSON.stringify({ id: pendingConfirmId, approve }),
      });

      hideConfirmModal();

      if (!resp.ok) {
        console.error("Confirm request failed:", resp.status, await resp.text());
      }
    }

    document.getElementById("btnApprove").addEventListener("click", () => submitConfirm(true));
    document.getElementById("btnReject").addEventListener("click", () => submitConfirm(false));

    // ── SSE streaming ────────────────────────────────────────────────────────

    async function sendMessage(message) {
      appendTurn("user").textContent = "You: " + message;
      const replyEl   = appendTurn("reply");
      replyEl.textContent = "";

      let timeline = null;
      const cards = {};

      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CoreCoder-Token": token,
        },
        body: JSON.stringify({ message }),
      });

      if (!resp.ok) {
        replyEl.className = "turn error";
        replyEl.textContent = "Request failed: " + resp.status;
        return;
      }

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        const frames = buf.split("\n\n");
        buf = frames.pop();

        for (const frame of frames) {
          if (!frame.startsWith("data: ")) continue;
          const evt = JSON.parse(frame.slice(6));

          if (evt.type === "token") {
            replyEl.textContent += evt.text;

          } else if (evt.type === "tool_start") {
            if (!timeline) timeline = makeTimeline(replyEl);
            cards[evt.id] = addToolCard(timeline, evt.id, evt.name, evt.args || {});

          } else if (evt.type === "tool_end") {
            const card = cards[evt.id];
            if (card) finishToolCard(card, evt.result || "");

          } else if (evt.type === "confirm_required") {
            showConfirmModal(evt);

          } else if (evt.type === "error") {
            replyEl.className = "turn error";
            replyEl.textContent += "\n[error] " + evt.message;

          } else if (evt.type === "done") {
            return;
          }
        }
      }
    }

    // ── Form handler ─────────────────────────────────────────────────────────

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      input.disabled = true;
      try {
        await sendMessage(message);
      } finally {
        input.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
