<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CoreCoder Web</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; }

  /* ── conversation log ── */
  #log { white-space: pre-wrap; border: 1px solid #ccc; border-radius: 6px; padding: 12px;
         min-height: 200px; margin-bottom: 12px; }
  #log .turn { margin-bottom: 16px; }
  #log .user  { color: #555; }
  #log .error { color: #c0392b; }

  /* ── tool timeline ── */
  .timeline { margin: 8px 0 0 0; padding: 0; list-style: none; }
  .tool-card {
    display: flex; flex-direction: column;
    border: 1px solid #e0e0e0; border-radius: 6px;
    padding: 8px 12px; margin-bottom: 6px;
    font-size: 13px; background: #fafafa;
  }
  .tool-card.running { border-color: #f0a500; background: #fffdf0; }
  .tool-card.done    { border-color: #4caf50; background: #f6fff6; }
  .tool-header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .tool-status { font-size: 11px; padding: 2px 6px; border-radius: 10px; }
  .tool-status.running { background: #f0a500; color: #fff; }
  .tool-status.done    { background: #4caf50; color: #fff; }
  .tool-args { color: #666; font-size: 12px; margin-top: 4px; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  .tool-result { color: #333; font-size: 12px; margin-top: 6px; white-space: pre-wrap;
                 max-height: 120px; overflow-y: auto; border-top: 1px solid #e0e0e0;
                 padding-top: 6px; display: none; }
  .tool-result.visible { display: block; }
  .toggle-result { font-size: 11px; color: #0077cc; cursor: pointer; margin-top: 4px;
                   background: none; border: none; padding: 0; }

  /* ── input form ── */
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px; font-size: 14px; }
  button { padding: 8px 16px; }
</style>
</head>
<body>
  <h1>CoreCoder Web</h1>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask CoreCoder to do something..." autocomplete="off">
    <button type="submit">Send</button>
  </form>

  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const log   = document.getElementById("log");
    const form  = document.getElementById("form");
    const input = document.getElementById("input");

    // ── DOM helpers ──────────────────────────────────────────────────────────

    function appendTurn(className) {
      const div = document.createElement("div");
      div.className = "turn " + className;
      log.appendChild(div);
      return div;
    }

    // Create a timeline <ul> inside the current reply turn element.
    function makeTimeline(container) {
      const ul = document.createElement("ul");
      ul.className = "timeline";
      container.appendChild(ul);
      return ul;
    }

    // Add a "running" tool card to the timeline and return it.
    function addToolCard(timeline, toolId, name, args) {
      const li = document.createElement("li");
      li.className = "tool-card running";
      li.dataset.toolId = toolId;

      const argsText = Object.entries(args)
        .map(([k, v]) => `${k}: ${JSON.stringify(v).slice(0, 80)}`)
        .join("  ");

      li.innerHTML = `
        <div class="tool-header">
          <span class="tool-status running">running</span>
          <span>${escHtml(name)}</span>
        </div>
        <div class="tool-args">${escHtml(argsText)}</div>
      `;
      timeline.appendChild(li);
      return li;
    }

    // Mark a card as done and attach the (collapsible) result.
    function finishToolCard(card, result) {
      card.classList.replace("running", "done");
      const badge = card.querySelector(".tool-status");
      badge.classList.replace("running", "done");
      badge.textContent = "done";

      const resultEl = document.createElement("div");
      resultEl.className = "tool-result";
      resultEl.textContent = result;
      card.appendChild(resultEl);

      // only show the toggle when result is non-trivial
      if (result && result !== "(no output)") {
        const toggle = document.createElement("button");
        toggle.className = "toggle-result";
        toggle.textContent = "▶ show result";
        toggle.addEventListener("click", () => {
          const visible = resultEl.classList.toggle("visible");
          toggle.textContent = visible ? "▼ hide result" : "▶ show result";
        });
        card.appendChild(toggle);
      }
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // ── SSE streaming ────────────────────────────────────────────────────────

    async function sendMessage(message) {
      appendTurn("user").textContent = "You: " + message;
      const replyEl   = appendTurn("reply");
      replyEl.textContent = "";

      // Timeline is appended as a child of the reply turn; it is created on
      // the first tool_start event so pure-text replies don't show an empty ul.
      let timeline = null;
      // Map tool_id -> card element so tool_end can find the right card.
      const cards = {};

      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CoreCoder-Token": token,
        },
        body: JSON.stringify({ message }),
      });

      if (!resp.ok) {
        replyEl.className = "turn error";
        replyEl.textContent = "Request failed: " + resp.status;
        return;
      }

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        const frames = buf.split("\n\n");
        buf = frames.pop(); // last chunk may be incomplete

        for (const frame of frames) {
          if (!frame.startsWith("data: ")) continue;
          const evt = JSON.parse(frame.slice(6));

          if (evt.type === "token") {
            replyEl.textContent += evt.text;

          } else if (evt.type === "tool_start") {
            if (!timeline) timeline = makeTimeline(replyEl);
            cards[evt.id] = addToolCard(timeline, evt.id, evt.name, evt.args || {});

          } else if (evt.type === "tool_end") {
            const card = cards[evt.id];
            if (card) finishToolCard(card, evt.result || "");

          } else if (evt.type === "error") {
            replyEl.className = "turn error";
            replyEl.textContent += "\n[error] " + evt.message;

          } else if (evt.type === "done") {
            return;
          }
        }
      }
    }

    // ── Form handler ─────────────────────────────────────────────────────────

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      input.disabled = true;
      try {
        await sendMessage(message);
      } finally {
        input.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
