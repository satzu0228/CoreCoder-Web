<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreCoder Web</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; display: flex;
         min-height: 100dvh; align-items: center; justify-content: center;
         margin: 0; padding: 24px; background: #f5f6f8; color: #1e2b3b; }
  .card { text-align: center; max-width: 440px; }
  .logo { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 20px;
          border-radius: 14px; background: #1e2b3b; color: #fff; font-weight: 700;
          font-size: 20px; font-family: ui-monospace, monospace; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
  p { margin: 0; color: #748093; font-size: 14px; line-height: 1.6; }
  code { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 6px;
         background: #fff; border: 1px solid #dde1e7; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">C</div>
    <h1>前端尚未构建</h1>
    <p>请在项目根目录运行 <code>npm run build</code> 构建前端，然后重启 CoreCoder Web 服务。</p>
    <p style="margin-top:12px">开发时可以使用 <code>npm run dev</code> 启动 Vite 开发服务器。</p>
  </div>
</body>
</html>
